<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grok Tutor · 4-quadrant observe</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05060a;
      color: #f2f4f8;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    /* Forced equal 2×2 — not restored session chrome */
    #quad {
      display: grid !important;
      grid-template-columns: 50vw 50vw !important;
      grid-template-rows: 50vh 50vh !important;
      width: 100vw;
      height: 100vh;
      gap: 0;
      margin: 0;
      padding: 0;
    }
    .q {
      position: relative;
      width: 50vw;
      height: 50vh;
      min-width: 0;
      min-height: 0;
      border: 1px solid #1e2433;
      display: flex;
      flex-direction: column;
      background: #0a0c12;
      overflow: hidden;
    }
    .bar {
      flex: 0 0 34px;
      height: 34px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 8px;
      background: #080a10;
      border-bottom: 1px solid #1e2433;
      z-index: 3;
    }
    .bar .lbl {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #5eead4;
      white-space: nowrap;
    }
    .bar .lbl.log { color: #a78bfa; }
    .bar select {
      flex: 1;
      min-width: 0;
      height: 26px;
      background: #12161f;
      color: #f2f4f8;
      border: 1px solid #2a3348;
      border-radius: 4px;
      font-size: 12px;
    }
    .bar button {
      height: 26px;
      border: 1px solid #2a3348;
      background: rgba(94, 234, 212, 0.12);
      color: #5eead4;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      padding: 0 8px;
    }
    .body { flex: 1; min-height: 0; position: relative; }
    .body iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #05020f;
    }
    .log {
      position: absolute;
      inset: 0;
      overflow: auto;
      padding: 8px 10px 12px;
      font-size: 12px;
    }
    .pulse {
      width: 9px; height: 9px; border-radius: 50%;
      background: #6b7385;
    }
    .pulse.on {
      background: #4ade80;
      box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.5);
      animation: p 1.1s ease-out infinite;
    }
    @keyframes p {
      70% { box-shadow: 0 0 0 7px rgba(74, 222, 128, 0); }
    }
    .meter {
      height: 8px; background: #1a1f2b; border-radius: 99px; overflow: hidden; margin: 6px 0 8px;
    }
    .meter > i {
      display: block; height: 100%; width: 0%;
      background: linear-gradient(90deg, #5eead4, #a78bfa);
      transition: width 0.3s;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      margin-bottom: 8px;
    }
    .stat {
      border: 1px solid #1e2433;
      border-radius: 6px;
      padding: 4px 6px;
      background: rgba(0,0,0,0.25);
    }
    .stat b { display: block; font-size: 15px; color: #5eead4; }
    .stat span { font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: #8b93a7; }
    .msg { color: #9aa3b5; margin: 0 0 8px; line-height: 1.35; }
    .msg strong { color: #f2f4f8; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; }
    th, td { text-align: left; padding: 3px 4px; border-bottom: 1px solid #1a1f2b; }
    th { color: #8b93a7; font-size: 9px; text-transform: uppercase; position: sticky; top: 0; background: #0a0c12; }
    tr.ok td { color: #86efac; }
    tr.soft td { color: #fde68a; }
    tr.bad td { color: #fca5a5; }
    tr.head td { color: #c4b5fd; font-weight: 700; background: rgba(167,139,250,0.08); }
    #err {
      display: none; color: #fde68a; background: rgba(251,191,36,0.1);
      border-left: 3px solid #fbbf24; padding: 6px 8px; margin-bottom: 8px; border-radius: 0 6px 6px 0;
    }
    .hb { margin-left: auto; font-size: 10px; color: #6b7385; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div id="quad">
    <!-- Q1 LOG -->
    <section class="q" id="q-log">
      <div class="bar">
        <span class="pulse" id="pulse"></span>
        <span class="lbl log">Q1 · Soak log</span>
        <span class="hb" id="hb">—</span>
        <button type="button" id="refreshLog">Refresh</button>
      </div>
      <div class="body">
        <div class="log">
          <div id="err"></div>
          <div class="meter"><i id="bar"></i></div>
          <div class="stats" id="stats"></div>
          <p class="msg" id="msg">Waiting for complete-suite soak…</p>
          <table>
            <thead>
              <tr><th>Time</th><th>Suite / check</th><th>St</th><th>ms</th><th>Note</th></tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- Q2–Q4 Hives (selectable, default distinct) -->
    <section class="q">
      <div class="bar">
        <span class="lbl">Q2 · Hive A</span>
        <select id="sel0"></select>
        <button type="button" data-reload="0">Reload</button>
      </div>
      <div class="body"><iframe id="fr0" title="Hive A"></iframe></div>
    </section>

    <section class="q">
      <div class="bar">
        <span class="lbl">Q3 · Hive B</span>
        <select id="sel1"></select>
        <button type="button" data-reload="1">Reload</button>
      </div>
      <div class="body"><iframe id="fr1" title="Hive B"></iframe></div>
    </section>

    <section class="q">
      <div class="bar">
        <span class="lbl">Q4 · Hive C</span>
        <select id="sel2"></select>
        <button type="button" data-reload="2">Reload</button>
      </div>
      <div class="body"><iframe id="fr2" title="Hive C"></iframe></div>
    </section>
  </div>

  <script>
    /** Each preset is a DIFFERENT orchestration shape (not spine three times). */
    const PRESETS = [
      { id: "spine", label: "Mission Spine", path: "/?orch=1&shape=spine" },
      { id: "integrity", label: "Integrity Triangle", path: "/?orch=1&shape=integrity-triangle" },
      { id: "four", label: "Four-agent plan", path: "/?orch=1&shape=four-agent" },
      { id: "claim", label: "Claim Diamond", path: "/?orch=1&shape=claim-diamond" },
      { id: "helix", label: "Field Helix", path: "/?orch=1&shape=lpin-helix" },
      { id: "sense", label: "Sense Orbit", path: "/?orch=1&shape=sense-orbit" },
      { id: "star", label: "Star Burst", path: "/?orch=1&shape=star-burst" },
      { id: "spine-galactic", label: "Spine + Galactic look", path: "/?orch=1&shape=spine&style=galactic" },
      { id: "four-galactic", label: "Four-agent + Galactic", path: "/?orch=1&shape=four-agent&style=galactic" },
      { id: "integrity-deep", label: "Integrity + Deep", path: "/?orch=1&shape=integrity-triangle&deep=1" },
      { id: "claim-deep", label: "Claim + Deep", path: "/?orch=1&shape=claim-diamond&deep=1" },
      { id: "idle", label: "Hive idle", path: "/" },
    ];
    /** Three different shapes by default — never all spine */
    const DEFAULTS = ["spine", "integrity", "four"];
    const KEY = "grok-quad-observe-v3";

    function load() {
      try {
        // Drop legacy v2 prefs that stuck all panes on spine variants
        localStorage.removeItem("grok-quad-observe-v1");
        localStorage.removeItem("grok-quad-observe-v2");
        const a = JSON.parse(localStorage.getItem(KEY) || "null");
        if (Array.isArray(a) && a.length === 3) {
          // Reject accidental all-same or all-spine-family
          const spiney = a.every(
            (id) => id === "spine" || id === "spine-galactic" || id === "deep" || id === "galactic",
          );
          if (!spiney && new Set(a).size >= 2) return a;
        }
      } catch (_) {}
      return DEFAULTS.slice();
    }
    function save(a) {
      try { localStorage.setItem(KEY, JSON.stringify(a)); } catch (_) {}
    }
    function pathOf(id) {
      return (PRESETS.find((p) => p.id === id) || PRESETS[0]).path;
    }

    const picks = load();
    [0, 1, 2].forEach((i) => {
      const sel = document.getElementById("sel" + i);
      const fr = document.getElementById("fr" + i);
      PRESETS.forEach((p) => {
        const o = document.createElement("option");
        o.value = p.id;
        o.textContent = p.label;
        sel.appendChild(o);
      });
      sel.value = picks[i] || DEFAULTS[i];
      function apply(bust) {
        picks[i] = sel.value;
        save(picks);
        fr.src = pathOf(sel.value) + (bust ? "&_r=" + Date.now() : "");
      }
      sel.onchange = () => apply(true);
      apply(false);
      document.querySelector('[data-reload="' + i + '"]').onclick = () => apply(true);
    });

    /* Live complete-suite log */
    let lastCycle = -1;
    let lastSuite = -1;
    const pulse = document.getElementById("pulse");
    const bar = document.getElementById("bar");
    const stats = document.getElementById("stats");
    const msg = document.getElementById("msg");
    const rows = document.getElementById("rows");
    const err = document.getElementById("err");
    const hb = document.getElementById("hb");

    function esc(s) {
      return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    async function tick() {
      hb.textContent = new Date().toLocaleTimeString();
      try {
        const res = await fetch("/soak/LIVE.json?t=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error("LIVE.json " + res.status);
        const s = await res.json();
        err.style.display = "none";
        pulse.classList.add("on");

        const minutes = s.minutes || 60;
        const elapsed = s.elapsedMs || 0;
        const pct = Math.min(100, (elapsed / (minutes * 60000)) * 100);
        bar.style.width = pct.toFixed(1) + "%";

        const elM = Math.floor(elapsed / 60000);
        const elS = Math.floor((elapsed % 60000) / 1000);
        stats.innerHTML =
          '<div class="stat"><b>' + (s.pass ?? 0) + "</b><span>pass</span></div>" +
          '<div class="stat"><b>' + (s.soft ?? 0) + "</b><span>soft</span></div>" +
          '<div class="stat"><b>' + (s.fail ?? 0) + "</b><span>fail</span></div>" +
          '<div class="stat"><b>' + (s.suitesComplete ?? 0) + "</b><span>full suites</span></div>" +
          '<div class="stat"><b>' + (s.suiteCheckIndex ?? 0) + "/" + (s.suiteCheckTotal ?? "—") + "</b><span>suite step</span></div>" +
          '<div class="stat"><b>' + elM + ":" + String(elS).padStart(2,"0") + "</b><span>elapsed</span></div>";

        const moved = (s.cycles ?? 0) !== lastCycle || (s.suitesComplete ?? 0) !== lastSuite;
        lastCycle = s.cycles ?? 0;
        lastSuite = s.suitesComplete ?? 0;

        msg.innerHTML =
          "<strong>Suite " + (s.suitesComplete ?? 0) + "</strong> · " +
          "step <strong>" + esc(s.currentPhase || "—") + "</strong> · " +
          esc(s.lastMessage || "—") +
          (moved ? " · <span style='color:#4ade80'>live</span>" : "");

        const recent = (s.recent || []).slice().reverse();
        if (!recent.length) {
          rows.innerHTML = '<tr><td colspan="5">Waiting for soak process…</td></tr>';
        } else {
          rows.innerHTML = recent.map(function (r) {
            const cls = r.kind === "suite"
              ? "head"
              : r.pass
                ? r.soft
                  ? "soft"
                  : "ok"
                : "bad";
            return (
              '<tr class="' + cls + '"><td>' + esc(r.t) +
              "</td><td>" + esc(r.name) +
              "</td><td>" + esc(r.status) +
              "</td><td>" + esc(r.ms) +
              "</td><td>" + esc(r.reason) +
              "</td></tr>"
            );
          }).join("");
        }
      } catch (e) {
        pulse.classList.remove("on");
        err.style.display = "block";
        err.textContent = "Log not updating: " + (e.message || e) + " — restart npm run test:sim1h";
      }
    }
    document.getElementById("refreshLog").onclick = tick;
    tick();
    setInterval(tick, 1500);
  </script>
</body>
</html>
